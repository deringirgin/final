<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Meme Analiz Sonucu</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; text-align: center; padding: 30px; }
        .container { background: white; padding: 30px; border-radius: 10px; display: inline-block; max-width: 600px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); text-align: left; }
        img { max-width: 100%; height: auto; border-radius: 5px; display: block; margin: 0 auto 20px auto; }
        .result-box { background: #f1f2f6; padding: 15px; border-radius: 5px; white-space: pre-line; line-height: 1.6; }
        a { display: inline-block; margin-top: 20px; text-decoration: none; background-color: #2ed573; color: white; padding: 10px 20px; border-radius: 5px; }
        a:hover { background-color: #26af5f; }
    </style>
</head>
<body>
    <div class="container" style="text-align: center;">
        <h2>🎯 Meme Analiz Sonucu</h2>
        
        <!-- Yüklenen Görsel -->
        <img src="{{ url_for('static', filename='uploads/' + filename) }}" alt="Yüklenen Meme">
        
        <!-- AI Açıklama Kutusu -->
        <div class="result-box">
            {{ result }}
        </div>
        
        <a href="/">Yeni Bir Meme Çözümle</a>
    </div>
</body>
</html>
