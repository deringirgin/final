<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HabitTracker - Günlük Alışkanlık Takipçisi</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --gray: #64748b;
            --border: #e2e8f0;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: 30px;
            margin-top: 20px;
            border: 1px solid var(--border);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            color: var(--primary);
            font-size: 24px;
            margin-bottom: 5px;
        }

        header p {
            color: var(--gray);
            font-size: 14px;
        }

        .stats-box {
            display: flex;
            justify-content: space-between;
            background: #f1f5f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-dark);
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 12px;
        }

        .habit-list {
            list-style: none;
        }

        .habit-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
            transition: transform 0.1s;
        }

        .habit-item:hover {
            border-color: #cbd5e1;
        }

        .habit-info {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            flex: 1;
        }

        .habit-info input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--success);
            cursor: pointer;
        }

        .habit-name {
            font-size: 14px;
            color: var(--text-color);
        }

        .completed .habit-name {
            text-decoration: line-through;
            color: var(--gray);
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 14px;
            padding: 5px;
        }

        .delete-btn:hover {
            color: #dc2626;
            background: none;
        }

        .empty-state {
            text-align: center;
            color: var(--gray);
            font-size: 14px;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>✨ HabitTracker</h1>
            <p>Günlük alışkanlıklarınızı oluşturun, küçük adımlarla büyük farklar yaratın.</p>
        </header>

        <!-- İstatistik Alanı -->
        <div class="stats-box">
            <span id="totalHabitsText">Toplam Alışkanlık: 0</span>
            <span id="completedHabitsText" style="color: var(--success);">Tamamlanan: 0</span>
        </div>

        <!-- Yeni Alışkanlık Ekleme -->
        <div class="input-group">
            <input type="text" id="habitInput" placeholder="Yeni bir alışkanlık ekle (Örn: 30 dk kitap oku)...">
            <button onclick="addHabit()">Ekle</button>
        </div>

        <!-- Alışkanlıklar Listesi -->
        <div class="section-title">Bugünkü Alışkanlıkların</div>
        <ul class="habit-list" id="habitList">
            <!-- Dinamik olarak dolacak -->
        </ul>
    </div>

    <script>
        // LocalStorage'dan verileri yükle
        let habits = JSON.parse(localStorage.getItem('habits')) || [];

        function saveAndRender() {
            localStorage.setItem('habits', JSON.stringify(habits));
            renderHabits();
        }

        function addHabit() {
            const input = document.getElementById('habitInput');
            const text = input.value.trim();

            if (text === '') {
                alert('Lütfen geçerli bir alışkanlık yazın.');
                return;
            }

            habits.push({
                id: Date.now(),
                name: text,
                completed: false
            });

            input.value = '';
            saveAndRender();
        }

        function toggleHabit(id) {
            habits = habits.map(habit => {
                if (habit.id === id) {
                    return { ...habit, completed: !habit.completed };
                }
                return habit;
            });
            saveAndRender();
        }

        function deleteHabit(id) {
            habits = habits.filter(habit => habit.id !== id);
            saveAndRender();
        }

        function renderHabits() {
            const listElement = document.getElementById('habitList');
            const totalText = document.getElementById('totalHabitsText');
            const completedText = document.getElementById('completedHabitsText');

            totalText.innerText = `Toplam Alışkanlık: ${habits.length}`;
            const completedCount = habits.filter(h => h.completed).length;
            completedText.innerText = `Tamamlanan: ${completedCount}`;

            if (habits.length === 0) {
                listElement.innerHTML = `<li class="empty-state">Henüz eklenmiş bir alışkanlık yok. Yukarıdan ekleyerek başla!</li>`;
                return;
            }

            let html = '';
            habits.forEach(habit => {
                html += `
                    <li class="habit-item ${habit.completed ? 'completed' : ''}">
                        <div class="habit-info" onclick="toggleHabit(${habit.id})">
                            <input type="checkbox" ${habit.completed ? 'checked' : ''} onclick="event.stopPropagation(); toggleHabit(${habit.id})">
                            <span class="habit-name">${escapeHtml(habit.name)}</span>
                        </div>
                        <button class="delete-btn" onclick="deleteHabit(${habit.id})">Sil</button>
                    </li>
                `;
            });
            listElement.innerHTML = html;
        }

        // Güvenlik için basit karakter koruması
        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Sayfa açıldığında listeyi yükle
        renderHabits();
    </script>
</body>
</html>
